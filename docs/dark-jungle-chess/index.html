<style>
:root {
  --bg: #191b21;
  --panel: #23262f;
  --line: #3a3f4e;
  --ivory: #f6f0de;
  --ivory-edge: #d8cfae;
  --red: #c0392b;
  --black: #22303f;
  --accent: #e8b64c;
  --text: #e8e6e0;
  --muted: #9aa0ad;
  --cell: min(21vw, 108px);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  background: radial-gradient(1100px 700px at 50% -10%, #2b2f3c, var(--bg));

html:lang(zh-Hant) body { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; }
html:lang(ja) body { font-family: "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif; }
.topbar {
  width: min(92vw, 640px);
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
  position: relative;

}
.rules-link {
  white-space: nowrap;
  padding: 5px 14px;
  font-size: 12px;
  color: var(--muted);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 999px;
  text-decoration: none;

}
.rules-link:hover { color: var(--accent); border-color: var(--accent); }
.rules-link.new { background: var(--accent); border-color: var(--accent); color: #1b1405; font-weight: 700; }
#lang-picker {
  display: flex;
  align-items: center;
  margin-inline-start: auto;
  padding-inline-start: 10px;

  border: 1px solid var(--line);

}
#lang-picker:hover { border-color: var(--accent); }
#lang-picker:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
#lang-picker select {
  max-width: 12em;
  padding: 5px 10px 5px 6px;
  font: inherit;

}
#lang-picker option { background: var(--panel); }
header { text-align: center; margin-bottom: 14px; }
h1 {

}
body.cjk h1 { letter-spacing: 6px; }
#players {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px 14px;
  margin-bottom: 10px;
}
.badge {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  border-radius: 999px;
  background: var(--panel);
  border: 2px solid var(--line);

.badge.active {

.chip {

  border-radius: 14px;

.cell {
  position: relative;
  border-radius: 10px;

.cell:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.cell.target-move { border: 2px solid rgba(120,200,130,.7); }
.cell.target-move::after {
  content: "";

  width: 22%; height: 22%;
  border-radius: 50%;
  background: rgba(120,200,130,.65);
}
.cell.target-capture { border: 2px solid rgba(235,100,90,.9); box-shadow: 0 0 14px rgba(235,100,90,.45); }
.card {
  position: absolute; inset: 0;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  user-select: none;
  transition: transform .12s;
}
@media (hover: hover) { .card:hover { transform: translateY(-2px); } }
.card.flip-in { animation: flipIn .45s ease-out; }
@keyframes flipIn {
  0%   { transform: rotateY(90deg) scale(.85); }
  100% { transform: rotateY(0deg) scale(1); }
}
.card.hidden-piece {
  background: linear-gradient(150deg, #3b4b6b, #26314a);
  border: 2px solid #526390;
  box-shadow: inset 0 0 18px rgba(0,0,0,.4), 0 3px 8px rgba(0,0,0,.4);

.card.revealed {

.card .rank {

.card .emoji { font-size: calc(var(--cell) * .40); line-height: 1; }

#confirm {

@media (max-width: 720px) {

<body>

<script src="engine.js?v=5f4a81c63c"></script>
<script>
'use strict';

/* ---------- 规则 ----------
   规则逻辑在 engine.js（DJCEngine），联网对局服务器也用同一份。页面只负责界面状态：
   选中格 selected、刚翻开的格子 lastFlipped。 */

const E = DJCEngine;
const { IDLE_DRAW_LIMIT, COLORS, canCapture, legalTargets } = E;
const EMOJI = { 1: '🕸️', 2: '🐘', 3: '🦁', 4: '🐯', 5: '🐺', 6: '🐑', 7: '🐱', 8: '🐭' };

/* ---------- 多语言 ----------
   文案在 i18n.js（DJC）。状态消息以 {k: 消息键, p: 参数} 结构存储，渲染时才翻译，
   所以对局中途切换语言，所有文字（含最后一条动作消息、结算画面）都会即时更新。 */

const I18N = DJC.T;
const f = DJC.fmt;

/* ---------- 存储（隐私模式等不可用时静默降级） ---------- */

const RULES_SEEN_KEY = 'dark-jungle-chess-rules-seen';   // rules.html 打开后写入
const SAVE_KEY = 'dark-jungle-chess-game-v1';           // 结构变化时改版本号，旧存档会被忽略

function storageGet(kind, key) {
  try { return window[kind].getItem(key); } catch (e) { return null; }
}
function storageSet(kind, key, value) {
  try { window[kind].setItem(key, value); } catch (e) { /* 忽略 */ }
}

// 对局存在 sessionStorage：去看规则再返回、或刷新页面都不会丢局。联网对局不存（服务器有），也不覆盖单机存档。
// 存档是外部输入：逐字段校验，任何一项不对就整份丢弃，开新局。服务器发来的视图也走同一个校验。
function saveGame() { if (!online) storageSet('sessionStorage', SAVE_KEY, JSON.stringify(state)); }

// 联网时的暗子：服务器不告诉我们是什么。只能由 stateFromView 放进棋盘，JSON 存档里不可能出现同一个对象。
const HIDDEN = Object.freeze({ rank: 0, color: null, revealed: false });

const isInt = (v, lo, hi) => Number.isInteger(v) && v >= lo && v <= hi;
const isPiece = p => !!p && typeof p === 'object' && isInt(p.rank, 1, 8) &&
  COLORS.includes(p.color) && typeof p.revealed === 'boolean';
const isPlayer = v => v === 'p1' || v === 'p2';
const PARAM_CHECKS = {
  a: isPiece, b: isPiece, piece: isPiece, player: isPlayer,
  c1: c => COLORS.includes(c), c2: c => COLORS.includes(c),
  round: v => isInt(v, 1, 99), n: v => v === 1 || v === 2, limit: v => v === IDLE_DRAW_LIMIT,
};
const isMsgPart = x => !!x && typeof x === 'object' && DJC.own(I18N.en.msg, x.k) &&
  (x.p === undefined || (typeof x.p === 'object' && x.p !== null &&
    Object.entries(x.p).every(([key, v]) => DJC.own(PARAM_CHECKS, key) && PARAM_CHECKS[key](v))));
const isParts = a => Array.isArray(a) && a.length <= 8 && a.every(isMsgPart);

function isValidSave(s) {
  if (!s || typeof s !== 'object' || !['assign', 'play', 'over'].includes(s.phase)) return false;
  if (!Array.isArray(s.board) || s.board.length !== 16 || !s.board.every(p => p === null || p === HIDDEN || isPiece(p))) return false;
  if (!s.captured || !COLORS.every(c => Array.isArray(s.captured[c]) && s.captured[c].every(isPiece))) return false;
  const total = s.board.filter(Boolean).length + s.captured.red.length + s.captured.black.length;
  if (total !== 16) return false;
  if (!s.players || !['p1', 'p2'].every(p => s.players[p] === null || COLORS.includes(s.players[p]))) return false;
  // 联网时可能在定色阶段就认输或判胜，结束时双方还没有颜色
  if (s.phase === 'play' && (!s.players.p1 || !s.players.p2)) return false;
  if (!isPlayer(s.current) || !isInt(s.round, 1, 99) || !isInt(s.idleSteps, 0, IDLE_DRAW_LIMIT)) return false;
  if (!Array.isArray(s.roundFlips) || s.roundFlips.length > 2 || !s.roundFlips.every(c => COLORS.includes(c))) return false;
  if (!(s.selected === null || isInt(s.selected, 0, 15))) return false;
  if (!(s.winner === undefined || s.winner === null || isPlayer(s.winner))) return false;
  return isParts(s.message) && isParts(s.overReason);
}

function loadGame() {
  try {
    const s = JSON.parse(storageGet('sessionStorage', SAVE_KEY));
    return isValidSave(s) ? { ...s, lastFlipped: null } : null;
  } catch (e) { return null; }
}

let lang = DJC.loadLang();
let updateLangPicker = () => {};

function L() { return I18N[lang]; }

function pieceLabel(pc) {
  return f(L().piece, { color: L()[pc.color], animal: L().animal[pc.rank - 1] });
}

function playerLabel(p) {
  const n = p === 'p1' ? 1 : 2, c = state.players[p];
  return c ? f(L().playerColor, { n, color: L()[c] }) : f(L().player, { n });
}

const PARAM_LABELS = { player: playerLabel, piece: pieceLabel, a: pieceLabel, b: pieceLabel, c1: c => L()[c], c2: c => L()[c] };

// parts: [{k: 消息键, p: 参数}]
function fmtMsg(parts) {
  return parts.map(x => {
    const vars = {};
    for (const [key, v] of Object.entries(x.p || {})) vars[key] = PARAM_LABELS[key] ? PARAM_LABELS[key](v) : v;
    return f(L().msg[x.k], vars);
  }).join(DJC.isCjk(lang) ? '' : ' ');
}

function setLang(l) {
  lang = l;
  DJC.saveLang(l);
  render();
}

/* ---------- 游戏状态与流程 ---------- */

let state = null;   // 规则状态（见 engine.js）+ 界面字段 selected、lastFlipped

function newGame() {
  state = { ...E.newGame(), selected: null, lastFlipped: null };
  render();
}

function onCellClick(i) {
  if (!state || state.phase === 'over') return;
  if (online && !myTurnOnline()) return;
  if (state.phase === 'assign') act({ flip: i });
  else playClick(i);
}

// 同屏对战：当前玩家就是操作者。联网时只把意图发给服务器，等它发回新视图再重绘。
function act(action) {
  if (online) {
    if (!send({ t: 'act', n: online.n, a: action })) return;
    online.pending = true;
    state.selected = null;
    render();
    return;
  }
  if (!E.apply(state, state.current, action).ok) return;
  state.selected = null;
  if ('flip' in action) state.lastFlipped = action.flip;
  render();
}

/* 对战阶段：点击处理（选子 / 落子 / 翻子） */
function playClick(i) {
  const myColor = state.players[state.current];
  const p = state.board[i];

  if (state.selected !== null) {
    if (legalTargets(state.board, state.selected).includes(i)) { act({ move: [state.selected, i] }); return; }
    // 已选中时误点暗子不能翻子（会白白用掉回合）；点另一个己方明子则改选它
    state.selected = (i !== state.selected && p && p.revealed && p.color === myColor) ? i : null;
    render();
    return;
  }
  if (p && !p.revealed) { act({ flip: i }); return; }
  if (p && p.revealed && p.color === myColor) { state.selected = i; render(); return; }
  state.selected = null;
  render();
}

/* ---------- 联网对战 ----------
   对局服务器（server/）持有棋盘、校验每一步，只发来脱敏视图：暗子只有「暗子」，没有等级和颜色。
   页面只发意图（翻第几格 / 从哪走到哪），收到新视图后整页重绘。协议见 design/dark-jungle-chess-online.md。 */

// 本地页面（127.0.0.1:8000）连本地服务器（server/ 下 npm run dev）；线上用 <meta id="online-server"> 的地址，为空时不显示联网入口。
// tools/csp.js 按这两个地址生成 connect-src。
const LOCAL_SERVER = 'http://127.0.0.1:8787';
const ONLINE_SERVER = typeof location !== 'undefined' && location.hostname === '127.0.0.1' ? LOCAL_SERVER
  : (typeof document !== 'undefined' && document.getElementById('online-server').content) || '';
const ONLINE_KEY = 'dark-jungle-chess-online';   // localStorage：{ 房间号: { token, at } }，座位凭证
const ROOM_CODE = /^[0-9A-HJKMNP-TV-Z]{10}$/;
const PING_MS = 20000;
const CLAIM_MS = 5 * 60000;           // 与服务器一致：对手离开满 5 分钟才能判胜
const TOKEN_TTL_MS = 25 * 3600000;    // 服务器 24 小时没动静就删房间

// 联网模式时的连接与座位信息；单机模式为 null。
// status：creating 建房中 / connecting 连接中 / open 已连上 / retrying 断线重连 / closed 不再重连（note 说明原因）
let online = null;

function loadTokens() {
  const out = {};
  try {
    const all = JSON.parse(storageGet('localStorage', ONLINE_KEY));
    for (const [room, e] of Object.entries(all && typeof all === 'object' ? all : {})) {
      if (ROOM_CODE.test(room) && e && typeof e.token === 'string' && e.token.length <= 64 &&
        Number.isFinite(e.at) && Date.now() - e.at < TOKEN_TTL_MS) out[room] = { token: e.token, at: e.at };
    }
  } catch (e) { /* 坏数据当作没有 */ }
  return out;
}
function saveToken(room, token) {
  const all = loadTokens();
  all[room] = { token, at: Date.now() };
  storageSet('localStorage', ONLINE_KEY, JSON.stringify(all));
}
function forgetToken(room) {
  const all = loadTokens();
  delete all[room];
  storageSet('localStorage', ONLINE_KEY, JSON.stringify(all));
}

const toPiece = c => ({ rank: c.rank, color: c.color, revealed: true });
const placeholderState = () => ({
  phase: 'assign', board: Array(16).fill(HIDDEN), players: { p1: null, p2: null }, current: 'p1', round: 1, roundFlips: [],
  captured: { red: [], black: [] }, idleSteps: 0, winner: undefined, message: [], overReason: [], selected: null, lastFlipped: null,
});

// 服务器视图 → 页面状态（与单机同一结构，渲染代码不用分两套）。结构不对会抛错或通不过 isValidSave，整条消息丢弃。
function stateFromView(v) {
  const parts = a => a.map(x => (x.p ? {
    k: x.k, p: Object.fromEntries(Object.entries(x.p).map(([key, val]) => [key, val && typeof val === 'object' ? toPiece(val) : val])),
  } : { k: x.k }));
  return {
    phase: v.phase, current: v.current, players: { p1: v.players.p1, p2: v.players.p2 }, round: v.round, roundFlips: [],
    board: v.board.map(c => (c === null ? null : c.hidden === true ? HIDDEN : toPiece(c))),
    captured: { red: v.captured.red.map(toPiece), black: v.captured.black.map(toPiece) },
    idleSteps: v.idleSteps, winner: v.winner, message: parts(v.message), overReason: parts(v.overReason),
    selected: null, lastFlipped: null,
  };
}

const opponent = seat => (seat === 'p1' ? 'p2' : 'p1');
const myTurnOnline = () => online.status === 'open' && online.seated.p2 && !online.pending && state.current === online.seat;
const canClaim = () => online.status === 'open' && online.seated.p2 && state.phase !== 'over' &&
  state.current !== online.seat && Date.now() - online.changedAt >= CLAIM_MS;
const inviteLink = () => `${location.origin}${location.pathname}?room=${online.room}`;

function enterOnline(room) {
  online = {
    room, seat: null, n: -1, seated: { p1: false, p2: false }, present: { p1: false, p2: false }, rematch: { p1: false, p2: false },
    status: room ? 'connecting' : 'creating', note: null, ws: null, attempts: 0, pending: false, changedAt: Date.now(),
    retryTimer: null, pingTimer: null, copiedUntil: 0,
  };
  state = placeholderState();
  render();
  if (room) connect();
}

async function startOnline() {
  enterOnline(null);
  const mine = online;
  try {
    const res = await fetch(`${ONLINE_SERVER}/rooms`, { method: 'POST' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const { room, token } = await res.json();
    if (!ROOM_CODE.test(room) || typeof token !== 'string') throw new Error('bad reply');
    if (online !== mine) return;   // 等待期间已经退出
    saveToken(room, token);
    online.room = room;
    online.status = 'connecting';
    history.replaceState(null, '', `?room=${room}`);
    connect();
  } catch (e) {
    if (online !== mine) return;
    online.status = 'closed';
    online.note = 'unavailable';
    render();
  }
}

function leaveOnline() {
  const o = online;
  online = null;
  if (o) {
    clearTimeout(o.retryTimer);
    clearInterval(o.pingTimer);
    if (o.ws) { o.ws.onclose = null; try { o.ws.close(1000); } catch (e) { /* 已关闭 */ } }
  }
  history.replaceState(null, '', location.pathname);
  state = loadGame();
  if (state) render(); else newGame();
}

function connect() {
  clearTimeout(online.retryTimer);
  clearInterval(online.pingTimer);
  if (online.ws) { online.ws.onclose = null; try { online.ws.close(1000); } catch (e) { /* 已关闭 */ } }
  const ws = new WebSocket(`${ONLINE_SERVER.replace(/^http/, 'ws')}/rooms/${online.room}/ws`);
  online.ws = ws;
  ws.onopen = () => {
    if (!online || ws !== online.ws) return;
    const saved = loadTokens()[online.room];
    ws.send(JSON.stringify({ t: 'hello', v: 1, token: saved ? saved.token : null }));
    // ping 由服务器直接回 pong，不唤醒房间；顺便刷新「对手很久没动」的判胜按钮
    online.pingTimer = setInterval(() => { if (ws.readyState === 1) ws.send('ping'); if (online) renderOnline(); }, PING_MS);
  };
  ws.onmessage = e => { if (online && ws === online.ws) onServerMessage(e.data); };
  ws.onclose = e => { if (online && ws === online.ws) onClosed(e.code); };
}

// 断线：房间没了、座位满了、被别的标签页顶掉时不再重连；其他情况指数退避重连（1、2、4……最多 30 秒）
const FINAL_CLOSE = { 4000: 'gone', 4004: 'gone', 4003: 'roomFull', 4001: 'replaced', 1008: 'unavailable', 1009: 'unavailable' };
function onClosed(code) {
  clearInterval(online.pingTimer);
  online.pending = false;
  if (online.status === 'closed') { render(); return; }
  if (FINAL_CLOSE[code]) {
    online.status = 'closed';
    online.note = FINAL_CLOSE[code];
    if (code === 4000 || code === 4004) forgetToken(online.room);
  } else {
    online.status = 'retrying';
    if (online.attempts >= 3) online.note = 'unavailable';
    online.retryTimer = setTimeout(connect, Math.min(30000, 1000 * 2 ** online.attempts++));
  }
  render();
}

// 切回前台、网络恢复、从 bfcache 返回时，断着的连接立即重连
function wake() {
  if (online && online.room && online.status === 'retrying') { online.attempts = 0; connect(); }
}

function send(msg) {
  if (!online || !online.ws || online.ws.readyState !== 1) return false;
  online.ws.send(JSON.stringify(msg));
  return true;
}

const isSeatFlags = o => !!o && typeof o === 'object' && typeof o.p1 === 'boolean' && typeof o.p2 === 'boolean';

function onServerMessage(text) {
  if (text === 'pong' || typeof text !== 'string') return;
  let m;
  try { m = JSON.parse(text); } catch (e) { return; }
  if (!m || typeof m !== 'object') return;
  if (m.t === 'welcome' && isPlayer(m.seat) && typeof m.token === 'string' && m.token.length <= 64) {
    saveToken(online.room, m.token);
  } else if (m.t === 'err' && typeof m.k === 'string') {
    online.pending = false;
    if (m.k === 'badToken') { forgetToken(online.room); online.status = 'closed'; online.note = 'gone'; }
    else if (m.k === 'roomFull') { online.status = 'closed'; online.note = 'roomFull'; }
    else online.note = m.k === 'cannotClaim' ? 'cannotClaim' : 'rejected';
    state.selected = null;
    render();
  } else if (m.t === 'state' && Number.isInteger(m.n) && isPlayer(m.you) &&
    isSeatFlags(m.seated) && isSeatFlags(m.online) && isSeatFlags(m.rematch)) {
    let next;
    try { next = stateFromView(m.view); } catch (e) { return; }
    if (!isValidSave(next)) return;
    if (online.status !== 'open') online.note = null;
    if (m.n !== online.n || m.you !== online.seat) {
      online.changedAt = Date.now();
      online.note = null;
      if (m.last && Number.isInteger(m.last.flip)) next.lastFlipped = m.last.flip;
      const saved = loadTokens()[online.room];
      if (saved) saveToken(online.room, saved.token);   // 房间还活着，凭证跟着续期
    } else {
      next.selected = state.selected;   // 只是对手上线/下线：保留选中
    }
    Object.assign(online, {
      n: m.n, seat: m.you, seated: m.seated, present: m.online, rematch: m.rematch, status: 'open', attempts: 0, pending: false,
    });
    state = next;
    render();
  }
}

// 确认框问的是哪件事：'restart' 重新开局，'resign' 认输
let confirmKind = 'restart';
function confirmed() {
  if (confirmKind === 'resign') send({ t: 'resign' });
  else newGame();
}

/* ---------- 渲染 ----------
   只用 textContent / createElement，不拼 HTML 字符串（页面的 CSP 开启了 Trusted Types，innerHTML 会直接报错） */

function span(className, text) {
  const el = document.createElement('span');
  if (className) el.className = className;
  el.textContent = String(text);
  return el;
}

function render() {
  renderStatic();
  // 状态栏是 aria-live，文字没变就不要重写，否则读屏会重复播报
  const statusEl = document.getElementById('status');
  const statusText = fmtMsg(state.message);
  if (statusEl.textContent !== statusText) statusEl.textContent = statusText;
  renderBadges();
  renderBoard();
  renderTrays();
  renderOverlay();
  renderOnline();
  state.lastFlipped = null;   // 翻转动画只播一次
  saveGame();
}

function renderStatic() {
  const O = L().online;
  DJC.applyLang(lang);
  document.title = L().title;
  document.getElementById('title').textContent = L().title;
  document.getElementById('restart').textContent = L().restart;
  document.getElementById('online-start').textContent = O.start;
  document.getElementById('online-resign').textContent = O.resign;
  document.getElementById('online-leave').textContent = O.leave;
  document.getElementById('overlay-leave').textContent = O.leave;
  document.getElementById('online-copy').textContent = online && Date.now() < online.copiedUntil ? O.copied : O.copy;
  document.getElementById('online-share').textContent = O.share;
  document.getElementById('online-claim').textContent = O.claim;
  document.getElementById('confirm-text').textContent = confirmKind === 'resign' ? O.confirmResign : L().confirmRestart;
  document.getElementById('confirm-ok').textContent = confirmKind === 'resign' ? O.resign : L().restart;
  document.getElementById('confirm-cancel').textContent = L().cancel;
  document.getElementById('tray-red-title').textContent = L().trayRed;
  document.getElementById('tray-black-title').textContent = L().trayBlack;
  updateLangPicker(lang);
  const seen = storageGet('localStorage', RULES_SEEN_KEY) === '1';
  const link = document.getElementById('rules-link');
  link.textContent = seen ? L().rulesLink : L().rulesLinkNew;
  link.classList.toggle('new', !seen);
}

function renderBadges() {
  for (const p of ['p1', 'p2']) {
    const color = state.players[p];
    const badge = document.getElementById(`badge-${p}`);
    const chip = document.getElementById(`chip-${p}`);
    const label = document.getElementById(`label-${p}`);
    badge.classList.toggle('active', state.phase !== 'over' && state.current === p);
    chip.className = 'chip' + (color ? ` ${color}` : '');
    const n = p === 'p1' ? 1 : 2;
    let text = color ? f(L().badge, { n, color: L()[color] }) : f(L().badgeNoColor, { n });
    if (online && online.seat === p) text = f(L().online.you, { badge: text });
    else if (online && online.seated.p2 && !online.present[p]) text = f(L().online.offline, { badge: text });
    label.textContent = text;
  }
}

function renderBoard() {
  const boardEl = document.getElementById('board');
  // 每次重绘都会重建格子，记下键盘焦点所在格，重绘后还原
  const active = document.activeElement;
  const focusIdx = active && boardEl.contains(active) ? Number(active.dataset.i) : null;
  boardEl.replaceChildren();
  boardEl.setAttribute('aria-label', L().board);
  const targets = (state.phase === 'play' && state.selected !== null)
    ? legalTargets(state.board, state.selected) : [];

  state.board.forEach((p, i) => {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.dataset.i = i;
    cell.setAttribute('role', 'button');
    cell.tabIndex = i === (focusIdx ?? 0) ? 0 : -1;
    const isTarget = targets.includes(i);
    if (isTarget) cell.classList.add(state.board[i] ? 'target-capture' : 'target-move');
    const extra = i === state.selected ? L().selected
      : isTarget ? (p ? L().canCapture : L().canMove) : '';
    const what = !p ? L().empty : p.revealed ? f(L().shown, { piece: pieceLabel(p), rank: p.rank }) : L().hidden;
    cell.setAttribute('aria-label', f(L().cell, { row: Math.floor(i / 4) + 1, col: i % 4 + 1, what }) + extra);

    if (p) {
      const card = document.createElement('div');
      card.setAttribute('aria-hidden', 'true');
      if (!p.revealed) {
        card.className = 'card hidden-piece';
        card.textContent = '🐾';
      } else {
        card.className = `card revealed ${p.color}`;
        card.append(span('rank', p.rank), span('emoji', EMOJI[p.rank]), span('name', L().animal[p.rank - 1]));
      }
      if (i === state.selected) card.classList.add('selected');
      if (i === state.lastFlipped) card.classList.add('flip-in');
      cell.appendChild(card);
    }
    boardEl.appendChild(cell);
    if (i === focusIdx) cell.focus();
  });
}

function renderTrays() {
  for (const color of ['red', 'black']) {
    const el = document.getElementById(`tray-${color}`);
    el.replaceChildren();
    for (const p of state.captured[color]) {
      const mini = document.createElement('div');
      mini.className = `mini ${color}`;
      // 只有中日文的动物名短到放得进小卡片，其他语言用等级数字代替
      mini.append(span('', EMOJI[p.rank]), span('', DJC.isCjk(lang) ? L().animal[p.rank - 1] : p.rank));
      el.appendChild(mini);
    }
  }
}

function renderOverlay() {
  const overlay = document.getElementById('overlay');
  // 结算对话框打开时，背后的棋局不可聚焦、不可点；顶栏（规则链接、语言）仍可用
  document.getElementById('table').inert = state.phase === 'over';
  if (state.phase !== 'over') { overlay.classList.remove('show'); return; }
  const O = L().online, again = document.getElementById('overlay-restart');
  let title = fmtMsg([state.winner === null ? { k: 'draw' } : { k: 'win', p: { player: state.winner } }]);
  let reason = fmtMsg(state.overReason);
  again.textContent = L().playAgain;
  again.disabled = false;
  document.getElementById('overlay-leave').hidden = !online;
  if (online) {
    // 再来一局要双方都点；点过的一方等对方
    if (state.winner) title = state.winner === online.seat ? O.youWin : O.youLose;
    if (online.rematch[online.seat]) { again.textContent = O.rematchWaiting; again.disabled = true; }
    else if (online.rematch[opponent(online.seat)]) reason += (DJC.isCjk(lang) ? '' : ' ') + O.rematchOffer;
  }
  document.getElementById('overlay-title').textContent = title;
  document.getElementById('overlay-reason').textContent = reason;
  if (!overlay.classList.contains('show')) {
    overlay.classList.add('show');
    document.getElementById('overlay-restart').focus();
  }
}

// 联网面板：连接状态、邀请链接、轮到谁、判胜按钮；底部按钮在单机/联网之间切换
function renderOnline() {
  const O = L().online, on = !!online;
  const el = id => document.getElementById(id);
  el('online').hidden = !on;
  el('restart').hidden = on;
  el('online-start').hidden = on || !ONLINE_SERVER;
  el('online-leave').hidden = !on;
  el('online-resign').hidden = !on || online.status !== 'open' || !online.seated.p2 || state.phase === 'over';
  if (!on) return;

  const inviting = !!online.room && !online.seated.p2 && online.status !== 'closed';
  el('online-invite').hidden = !inviting;
  if (inviting) el('online-link').value = inviteLink();
  el('online-share').hidden = !(typeof navigator !== 'undefined' && navigator.share);
  el('online-claim').hidden = !canClaim();

  let key = online.note;
  if (!key) {
    if (online.status === 'creating' || online.status === 'connecting') key = 'connecting';
    else if (online.status === 'retrying') key = 'reconnecting';
    else if (!online.seated.p2) key = 'invite';
    else if (state.phase === 'over') key = null;
    else if (state.current === online.seat) key = 'yourTurn';
    else key = canClaim() ? 'away' : 'theirTurn';
  }
  const text = key ? O[key] : '';
  if (el('online-text').textContent !== text) el('online-text').textContent = text;
}

/* ---------- 启动 ---------- */

if (typeof document !== 'undefined') {
  const boardEl = document.getElementById('board');
  boardEl.addEventListener('click', e => {
    const cell = e.target.closest('.cell');
    if (cell) onCellClick(Number(cell.dataset.i));
  });
  const STEP = { ArrowUp: -4, ArrowDown: 4, ArrowLeft: -1, ArrowRight: 1 };
  boardEl.addEventListener('keydown', e => {
    const cell = e.target.closest('.cell');
    if (!cell) return;
    const i = Number(cell.dataset.i);
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      onCellClick(i);
    } else if (e.key in STEP) {
      e.preventDefault();
      const j = i + STEP[e.key];
      const sameRow = Math.floor(j / 4) === Math.floor(i / 4);
      if (j < 0 || j > 15 || (Math.abs(STEP[e.key]) === 1 && !sameRow)) return;
      cell.tabIndex = -1;
      const next = boardEl.children[j];
      next.tabIndex = 0;
      next.focus();
    }
  });
  // 页内确认框：部分 App 内置浏览器会屏蔽 window.confirm（直接返回 false），重新开局就永远点不动
  const confirmDlg = document.getElementById('confirm');
  const ask = kind => {
    confirmKind = kind;
    renderStatic();
    if (typeof confirmDlg.showModal === 'function') confirmDlg.showModal();
    else if (window.confirm(document.getElementById('confirm-text').textContent)) confirmed();
  };
  const on = (id, fn) => document.getElementById(id).addEventListener('click', fn);
  on('restart', () => {
    const inProgress = state.phase !== 'over' && state.board.some(p => !p || p.revealed);
    if (!inProgress) newGame(); else ask('restart');
  });
  on('confirm-ok', () => { confirmDlg.close(); confirmed(); });
  on('confirm-cancel', () => confirmDlg.close());
  on('overlay-restart', () => {
    if (online) { send({ t: 'rematch' }); return; }
    newGame();
    boardEl.children[0].focus();
  });
  on('online-start', startOnline);
  on('online-leave', leaveOnline);
  on('overlay-leave', leaveOnline);
  on('online-resign', () => ask('resign'));
  on('online-claim', () => send({ t: 'claim' }));
  on('online-copy', () => {
    const copied = () => { online.copiedUntil = Date.now() + 2000; render(); setTimeout(() => { if (online) render(); }, 2000); };
    const select = () => document.getElementById('online-link').select();
    if (navigator.clipboard) navigator.clipboard.writeText(inviteLink()).then(copied, select); else select();
  });
  on('online-share', () => {
    navigator.share({ title: L().title, url: inviteLink() }).catch(() => { /* 用户取消 */ });
  });
  updateLangPicker = DJC.mountLangPicker(document.getElementById('lang-picker'), setLang);
  // 从规则页按返回键回来时，页面可能直接从 bfcache 恢复，需要刷新链接状态和在规则页改过的语言
  window.addEventListener('pageshow', e => { if (e.persisted && state) { lang = DJC.loadLang(); render(); wake(); } });
  window.addEventListener('online', wake);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') wake(); });

  const room = ONLINE_SERVER && typeof location !== 'undefined' &&
    (new URLSearchParams(location.search).get('room') || '').toUpperCase();
  if (room && ROOM_CODE.test(room)) {
    enterOnline(room);
  } else {
    state = loadGame();
    try {
      if (state) render(); else newGame();
    } catch (e) {
      newGame();   // 校验漏掉的坏存档也不能让页面卡死
    }
  }
}
