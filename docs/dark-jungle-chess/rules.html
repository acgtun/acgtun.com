<!DOCTYPE html>
<!--
  暗棋斗兽棋 · Dark Jungle Chess 玩法说明，文案在 i18n.js。IDLE_DRAW_LIMIT 必须和 index.html 一致，tests/game.test.js 会校验。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-AZhHnS01cMgoK4tSiEEl5PGKIRACp1Xivc0c7oCLm0Q='; style-src 'sha256-dOlZG/L+LbOqZb4uk63m1Cst6Fd35pMh+wWCf3jzQRs='; img-src data:; base-uri 'none'; form-action 'none'; require-trusted-types-for 'script'; trusted-types 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>玩法说明 · 暗棋斗兽棋</title>
<meta name="description" content="暗棋斗兽棋 · Dark Jungle Chess 玩法说明：棋子等级、吃子规则、定色、对战与胜负。How to play Dark Jungle Chess.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
<style>
:root {
  --bg: #191b21;
  --panel: #23262f;
  --line: #3a3f4e;
  --ivory: #f6f0de;
  --red: #c0392b;
  --black: #22303f;
  --accent: #e8b64c;
  --text: #e8e6e0;
  --muted: #9aa0ad;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  background: radial-gradient(1100px 700px at 50% -10%, #2b2f3c, var(--bg));
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 18px 12px 32px;
}
html:lang(zh-CN) body { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
html:lang(zh-Hant) body { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; }
html:lang(ja) body { font-family: "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif; }
.topbar {
  width: min(92vw, 640px);
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 18px;
}
.back-link {
  white-space: nowrap;
  padding: 5px 14px;
  font-size: 12px;
  color: #1b1405;
  background: var(--accent);
  border-radius: 999px;
  text-decoration: none;
  font-weight: 700;
}
#lang-picker {
  display: flex;
  align-items: center;
  margin-inline-start: auto;
  padding-inline-start: 10px;
  font-size: 12px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 999px;
}
#lang-picker:hover { border-color: var(--accent); }
#lang-picker:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
#lang-picker select {
  max-width: 12em;
  padding: 5px 10px 5px 6px;
  font: inherit;
  color: var(--text);
  background: transparent;
  border: none;
  outline: none;
  cursor: pointer;
}
#lang-picker option { background: var(--panel); }
main {
  width: min(92vw, 640px);
  padding: 20px 22px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  font-size: 15px;
  line-height: 1.75;
}
h1 {
  color: var(--accent);
  font-size: 24px;
  letter-spacing: 1px;
  text-align: center;
  margin-bottom: 6px;
}
body.cjk h1 { letter-spacing: 4px; }
h2 { color: var(--accent); font-size: 15px; margin: 18px 0 6px; }
ul { padding-inline-start: 20px; }
li { margin: 3px 0; }
li b { color: var(--accent); }
.rank-row { display: flex; flex-wrap: wrap; gap: 6px; }
.rank-chip {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 2px 9px;
  border-radius: 6px;
  background: linear-gradient(160deg, var(--ivory), #eadfbe);
  color: var(--black);
  font-size: 14px;
  font-weight: 600;
}
.rank-chip .r { color: var(--red); font-weight: 700; }
.play-btn {
  display: block;
  width: fit-content;
  margin: 22px auto 0;
  padding: 10px 32px;
  font-size: 15px;
  font-weight: 700;
  color: #1b1405;
  background: var(--accent);
  border-radius: 8px;
  text-decoration: none;
}
</style>
</head>
<body>
<nav class="topbar">
  <a class="back-link" id="back-link" href="./"></a>
  <div id="lang-picker"></div>
</nav>
<main id="rules"></main>
<script src="i18n.js?v=5c811e63c0"></script>
<script>
'use strict';

const IDLE_DRAW_LIMIT = 40;
const EMOJI = { 1: '🕸️', 2: '🐘', 3: '🦁', 4: '🐯', 5: '🐺', 6: '🐑', 7: '🐱', 8: '🐭' };
const RULES_SEEN_KEY = 'dark-jungle-chess-rules-seen';

let lang = DJC.loadLang();
let updateLangPicker = () => {};

function render() {
  const T = DJC.T[lang], R = T.rules;
  const vars = { limit: IDLE_DRAW_LIMIT };
  T.animal.forEach((name, i) => { vars[`a${i + 1}`] = name; });
  DJC.applyLang(lang);
  document.title = `${R.title} · ${T.title}`;
  document.getElementById('back-link').textContent = R.back;
  updateLangPicker(lang);
  const rankRow = el('div', 'rank-row');
  for (let r = 1; r <= 8; r++) rankRow.append(el('span', 'rank-chip', el('span', 'r', r), `${EMOJI[r]} ${T.animal[r - 1]}`));
  const parts = [el('h1', '', R.title), el('h2', '', DJC.fmt(R.ranks, vars)), rankRow];
  for (const [h, items] of R.sections)
    parts.push(el('h2', '', h), el('ul', '', ...items.map(x => el('li', '', ...withBold(DJC.fmt(x, vars))))));
  const play = el('a', 'play-btn', R.play);
  play.href = './';
  parts.push(play);
  document.getElementById('rules').replaceChildren(...parts);
}

// 只用 createElement / 文本节点，不拼 HTML（CSP 开启了 Trusted Types）
function el(tag, className, ...children) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  node.append(...children.map(c => (typeof c === 'object' ? c : String(c))));
  return node;
}

// '**粗体**' 标记转成 <b>，其余保持纯文本
function withBold(text) {
  return text.split(/\*\*(.+?)\*\*/).map((seg, i) => (i % 2 ? el('b', '', seg) : seg)).filter(seg => seg !== '');
}

if (typeof document !== 'undefined') {
  try { window.localStorage.setItem(RULES_SEEN_KEY, '1'); } catch (e) { /* 忽略 */ }
  updateLangPicker = DJC.mountLangPicker(document.getElementById('lang-picker'), l => { lang = l; DJC.saveLang(l); render(); });
  render();
}
</script>
</body>
</html>
